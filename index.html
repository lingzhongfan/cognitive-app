<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CAS v8.5 (Stable Connect)</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* ==================== 样式表 ==================== */
        :root {
            --primary: #2A5C82; --accent: #FF7043; --bg: #F8F9FA; 
            --chat-bg: #FFF; --user-msg: #95EC69; --ai-msg: #FFF;
            --shadow: 0 10px 30px rgba(0,0,0,0.08);
        }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* 视图与容器 */
        .view-section { display: none; flex: 1; flex-direction: column; animation: fadeIn 0.3s; }
        .view-section.active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .container { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 20px; max-width: 600px; margin: 0 auto; width: 100%; box-sizing: border-box; }
        .card { background: white; padding: 30px; border-radius: 16px; box-shadow: var(--shadow); text-align: center; }
        
        /* 按钮与输入 */
        .btn { padding: 12px 20px; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-success { background: #00B894; color: white; }
        .btn-outline { background: #eee; color: #333; }
        input, select { padding: 12px; border: 1px solid #ddd; border-radius: 8px; width: 100%; box-sizing: border-box; font-size: 1rem; margin-bottom: 10px; outline: none; background: #fff; }
        
        /* 聊天界面 */
        .chat-header { padding: 15px; background: rgba(255,255,255,0.95); border-bottom: 1px solid #eee; display: flex; align-items: center; justify-content: space-between; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; margin-right: 10px; }
        .chat-history { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; padding-bottom: 80px; }
        .msg-row { display: flex; width: 100%; } .msg-row.user { justify-content: flex-end; }
        .msg-bubble { padding: 12px 16px; border-radius: 16px; max-width: 85%; font-size: 1rem; line-height: 1.5; box-shadow: 0 1px 2px rgba(0,0,0,0.05); position: relative; word-wrap: break-word; }
        .msg-bubble.ai { background: var(--ai-msg); border-top-left-radius: 2px; } .msg-bubble.user { background: var(--user-msg); border-top-right-radius: 2px; }
        .msg-bubble.error { background: #ffebee; color: #c62828; border: 1px solid #ffcdd2; font-size: 0.9rem; }
        
        /* 输入区 */
        .input-area { position: absolute; bottom: 0; left: 0; right: 0; padding: 15px; background: #FFF; border-top: 1px solid #eee; display: flex; gap: 10px; align-items: center; z-index: 20; }
        .input-box { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 24px; font-size: 1rem; outline: none; margin: 0; }
        .btn-icon { width: 45px; height: 45px; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; background: #f0f0f0; color: #555; }
        .btn-send { background: var(--primary); color: white; }
        
        /* Loading */
        .typing-indicator span { display: inline-block; width: 6px; height: 6px; background: #ccc; border-radius: 50%; animation: type 1s infinite; margin: 0 2px; }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; } .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes type { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

        /* Game Engines (SDMT/T5) */
        .sdmt-header { display: flex; justify-content: space-between; margin-bottom: 20px; font-weight: bold; }
        .sdmt-legend { display: flex; gap: 5px; justify-content: center; margin-bottom: 20px; background: #f0f4f8; padding: 10px; border-radius: 12px; overflow-x: auto; }
        .legend-item { display: flex; flex-direction: column; align-items: center; background: white; border: 1px solid #ddd; border-radius: 6px; width: 45px; padding: 5px 0; }
        .target-box { font-size: 4rem; text-align: center; margin: 20px 0; color: var(--primary); height: 80px; }
        .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 360px; margin: 0 auto; }
        .key-btn { padding: 20px; font-size: 1.5rem; background: white; border: 1px solid #ddd; border-radius: 10px; box-shadow: 0 4px 0 #eee; cursor: pointer; font-weight: bold; }
        .key-btn:active { transform: translateY(3px); box-shadow: none; }
        .t5-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-top: 20px; }
        .t5-btn { padding: 15px; border: 2px solid #eee; background: white; border-radius: 10px; font-size: 1.1rem; cursor: pointer; transition: 0.2s; }
        .t5-btn.selected { border-color: var(--primary); background: #e3f2fd; color: var(--primary); font-weight: bold; }

        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 100; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 25px; border-radius: 16px; width: 90%; max-width: 400px; max-height: 90vh; overflow-y: auto; text-align: left; }
        .setting-label { font-size: 0.85rem; color: #666; font-weight: bold; display: block; margin-bottom: 5px; }
        #status-msg { font-size: 0.85rem; margin-bottom: 10px; min-height: 20px; }
    </style>
</head>
<body>

<div id="view-reg" class="view-section active">
    <div class="container">
        <div class="card">
            <h1 style="margin:0; color:var(--primary);">CAS v8.5</h1>
            <p style="color:#666; font-size:0.9rem;">AI Doctor (Debug Edition)</p>
            <hr style="border:0; border-top:1px solid #eee; margin:20px 0;">
            <input type="text" id="p_id" placeholder="ID / 姓名" required>
            <button class="btn btn-primary" style="width:100%; margin-top:20px; padding:15px;" onclick="startSystem()">开始评估 (Start)</button>
            <p style="font-size:0.8rem; color:#999; margin-top:15px; cursor:pointer; text-decoration: underline;" onclick="toggleSettings()">⚙️ 点击配置 API Key (必填)</p>
        </div>
    </div>
</div>

<div id="view-chat" class="view-section">
    <div class="chat-header">
        <div style="display:flex; align-items:center;">
            <div class="avatar">👨‍⚕️</div>
            <div style="margin-left:10px;">
                <div style="font-weight:bold;">Dr. CAS</div>
                <div id="model-badge" style="font-size:0.7rem; color:var(--primary); background:#e3f2fd; padding:2px 6px; border-radius:4px;">未连接</div>
            </div>
        </div>
        <button class="btn btn-outline" style="padding: 5px 10px; font-size: 0.8rem;" onclick="toggleSettings()">设置</button>
    </div>
    <div id="chat-box" class="chat-history"></div>
    <div class="input-area">
        <input type="text" id="user-input" class="input-box" placeholder="输入消息..." onkeydown="if(event.key==='Enter') sendMessage()">
        <button class="btn-icon btn-send" onclick="sendMessage()">➤</button>
    </div>
</div>

<div id="view-sdmt" class="view-section">
    <div class="container">
        <div class="card">
            <div class="sdmt-header"><span>快速匹配</span><span style="color:var(--accent);">⏱ <span id="sdmt-timer">--</span>s</span></div>
            <div id="sdmt-legend" class="sdmt-legend"></div>
            <div class="target-box" id="sdmt-target">?</div>
            <div class="keypad">
                <button class="key-btn" onclick="inputSDMT(1)">1</button><button class="key-btn" onclick="inputSDMT(2)">2</button><button class="key-btn" onclick="inputSDMT(3)">3</button>
                <button class="key-btn" onclick="inputSDMT(4)">4</button><button class="key-btn" onclick="inputSDMT(5)">5</button><button class="key-btn" onclick="inputSDMT(6)">6</button>
                <button class="key-btn" onclick="inputSDMT(7)">7</button><button class="key-btn" onclick="inputSDMT(8)">8</button><button class="key-btn" onclick="inputSDMT(9)">9</button>
            </div>
        </div>
    </div>
</div>

<div id="view-t5" class="view-section">
    <div class="container">
        <div class="card">
            <h2>再认测试</h2>
            <p style="color:#666;">请点击刚才对话中我们要买的三样东西：</p>
            <div id="t5-grid" class="t5-grid"></div>
            <button class="btn btn-primary" style="margin-top:20px; width:100%;" onclick="submitT5()">确认选择</button>
        </div>
    </div>
</div>

<div id="view-report" class="view-section">
    <div class="container">
        <div class="card" style="text-align:left;">
            <h2 style="text-align:center;">📋 评估报告</h2>
            <div id="report-content">AI 分析中...</div>
            <button class="btn-primary" style="width:100%; margin-top:20px;" onclick="location.reload()">结束</button>
        </div>
    </div>
</div>

<div id="settings-modal" class="modal">
    <div class="modal-content">
        <h3 style="margin-top:0;">🔧 模型配置</h3>
        
        <div style="margin-bottom:15px;">
            <label class="setting-label">AI 提供商</label>
            <select id="ai-provider" onchange="updateProviderFields()">
                <option value="deepseek">DeepSeek (国内推荐)</option>
                <option value="gemini">Google Gemini (需梯子)</option>
                <option value="qwen">通义千问 (Qwen)</option>
                <option value="kimi">Kimi (月之暗面)</option>
                <option value="openai">OpenAI (GPT-4)</option>
            </select>
        </div>

        <div style="margin-bottom:15px;">
            <label class="setting-label">API Key</label>
            <input type="password" id="api-key" placeholder="sk-...">
        </div>

        <div id="group-model" style="margin-bottom:15px; display:none;">
            <label class="setting-label">Model Name</label>
            <input type="text" id="model-name" placeholder="default">
        </div>

        <div id="status-msg"></div>

        <div style="display:flex; gap:10px;">
            <button class="btn btn-outline" style="flex:1;" onclick="testConnection()">📡 测试连接</button>
            <button class="btn btn-primary" style="flex:1;" onclick="saveSettings()">保存</button>
        </div>
        <div style="margin-top:10px; text-align:center;">
            <a href="#" onclick="toggleSettings()" style="color:#999; font-size:0.9rem;">关闭</a>
        </div>
    </div>
</div>

<script>
/* =========================================
   CAS v8.5 Logic Core (Robust Connectivity)
   ========================================= */

let state = {
    config: { provider: 'deepseek', apiKey: '', modelName: '' },
    chatHistory: [],
    sdmt: { score: 0, responses: [], map: [], lastTime: 0 },
    t5: { selected: [], score: 0 }
};

const WORDS_TARGET = ["老虎", "钢琴", "玫瑰"];
const WORDS_DISTRACT = ["狮子", "吉他", "百合", "桌子", "苹果", "汽车"];
const SYMBOLS = ['⊏', '⊐', '⊓', '⊔', '△', '○', '□', '◇', '☆'];

// 初始化
window.onload = () => {
    loadSettings();
    if (!state.config.apiKey) toggleSettings();
};

function loadSettings() {
    const saved = localStorage.getItem('cas_config_v85');
    if (saved) {
        state.config = JSON.parse(saved);
        document.getElementById('ai-provider').value = state.config.provider;
        document.getElementById('api-key').value = state.config.apiKey;
        document.getElementById('model-name').value = state.config.modelName || "";
        updateBadge();
    }
    updateProviderFields();
}

// 核心：通用 LLM 调用
async function callLLM(history, isTest = false) {
    const { provider, apiKey, modelName } = state.config;
    if (!apiKey) throw new Error("缺少 API Key");

    const sysPrompt = "你是神经内科医生Dr. CAS。任务：1.问候 2.让用户记[老虎,钢琴,玫瑰] 3.干扰 4.输[START_SDMT] 5.输[START_RECOGNITION] 6.输[GENERATE_REPORT]。每次只一步。";
    const userMessage = isTest ? "Hello" : null;
    
    // 构造请求
    let url, payload, headers = { 'Content-Type': 'application/json' };

    if (provider === 'gemini') {
        url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
        let contents = isTest ? [{ parts: [{ text: "Hi" }] }] : history;
        payload = { contents };
    } else {
        // OpenAI 兼容模式 (DeepSeek, Kimi, Qwen)
        headers['Authorization'] = `Bearer ${apiKey}`;
        
        let baseUrl = "https://api.openai.com/v1";
        let model = "gpt-3.5-turbo";

        if (provider === 'deepseek') {
            baseUrl = "https://api.deepseek.com"; 
            model = "deepseek-chat";
        } else if (provider === 'qwen') {
            baseUrl = "https://dashscope.aliyuncs.com/compatible-mode/v1"; 
            model = "qwen-plus";
        } else if (provider === 'kimi') {
            baseUrl = "https://api.moonshot.cn/v1"; 
            model = "moonshot-v1-8k";
        }

        url = `${baseUrl}/chat/completions`;
        
        let messages = [{ role: "system", content: sysPrompt }];
        if (isTest) messages.push({ role: "user", content: "Hi" });
        else {
            history.forEach(h => {
                let role = h.role === 'model' ? 'assistant' : 'user';
                messages.push({ role, content: h.parts[0].text });
            });
        }

        payload = { model: modelName || model, messages, temperature: 0.7 };
    }

    try {
        const res = await fetch(url, { method: 'POST', headers, body: JSON.stringify(payload) });
        const data = await res.json();
        
        if (data.error) throw new Error(data.error.message || JSON.stringify(data.error));
        
        if (provider === 'gemini') return data.candidates[0].content.parts[0].text;
        else return data.choices[0].message.content;

    } catch (e) {
        console.error("API Error:", e);
        if (e.message.includes("Failed to fetch")) throw new Error("网络连接失败 (跨域/断网)");
        throw e;
    }
}

// 连接测试
async function testConnection() {
    const btn = document.querySelector('button[onclick="testConnection()"]');
    const status = document.getElementById('status-msg');
    
    // 临时保存当前输入以供测试
    state.config.provider = document.getElementById('ai-provider').value;
    state.config.apiKey = document.getElementById('api-key').value;
    state.config.modelName = document.getElementById('model-name').value;

    btn.disabled = true; btn.innerText = "测试中...";
    status.innerHTML = "正在连接服务器...";
    status.style.color = "#666";

    try {
        await callLLM([], true);
        status.innerHTML = "✅ 连接成功！模型响应正常。";
        status.style.color = "green";
    } catch (e) {
        status.innerHTML = `❌ 失败: ${e.message}`;
        status.style.color = "red";
    } finally {
        btn.disabled = false; btn.innerText = "📡 测试连接";
    }
}

// 聊天交互
async function sendMessage() {
    const input = document.getElementById('user-input');
    const text = input.value.trim();
    if(!text) return;
    
    addMsg('user', text);
    state.chatHistory.push({ role: "user", parts: [{ text: text }] });
    input.value = '';

    const loadId = addMsg('ai', '<div class="typing-indicator"><span></span><span></span><span></span></div>');
    
    try {
        const reply = await callLLM(state.chatHistory);
        document.getElementById(loadId).remove();
        processAI(reply);
    } catch(e) {
        document.getElementById(loadId).innerHTML = `⚠️ Error: ${e.message}`;
        document.getElementById(loadId).classList.add('error');
    }
}

function processAI(text) {
    if (text.includes("[START_SDMT]")) {
        addMsg('ai', "好的，请准备开始测试...");
        setTimeout(startSDMT, 1500);
    } else if (text.includes("[START_RECOGNITION]")) {
        addMsg('ai', "请选出刚才提到的物品。");
        setTimeout(startT5, 1500);
    } else if (text.includes("[GENERATE_REPORT]")) {
        addMsg('ai', text.replace("[GENERATE_REPORT]", ""));
        generateReport();
    } else {
        addMsg('ai', text);
        state.chatHistory.push({ role: "model", parts: [{ text: text }] });
    }
}

// SDMT
function startSDMT() {
    showView('view-sdmt');
    state.sdmt.map = SYMBOLS.map((s, i) => ({ s, n: i + 1 })).sort(() => Math.random() - 0.5);
    document.getElementById('sdmt-legend').innerHTML = state.sdmt.map.map(m => `<div class="legend-item"><div class="legend-sym">${m.s}</div><div class="legend-num">${m.n}</div></div>`).join('');
    state.sdmt.score = 0; state.sdmt.responses = [];
    nextSDMT();
    let time = 30; document.getElementById('sdmt-timer').innerText = time;
    sdmtTimer = setInterval(() => { time--; document.getElementById('sdmt-timer').innerText = time; if(time <= 0) endSDMT(); }, 1000);
}
function nextSDMT() {
    sdmtTarget = state.sdmt.map[Math.floor(Math.random() * 9)];
    document.getElementById('sdmt-target').innerText = sdmtTarget.s;
    state.sdmt.lastTime = Date.now();
}
window.inputSDMT = (n) => {
    const correct = n === sdmtTarget.n;
    if(correct) state.sdmt.score++;
    state.sdmt.responses.push({ correct, latency: Date.now() - state.sdmt.lastTime });
    nextSDMT();
};
function endSDMT() {
    clearInterval(sdmtTimer);
    showView('view-chat');
    sendSystemMsg(`SDMT得分: ${state.sdmt.score}`);
}

// T5
function startT5() {
    showView('view-t5');
    const grid = document.getElementById('t5-grid');
    grid.innerHTML = '';
    [...WORDS_TARGET, ...WORDS_DISTRACT].sort(()=>Math.random()-0.5).forEach(w => {
        const btn = document.createElement('div');
        btn.className = 't5-btn'; btn.innerText = w;
        btn.onclick = () => {
            if(state.t5.selected.includes(w)) { state.t5.selected = state.t5.selected.filter(x=>x!==w); btn.classList.remove('selected'); }
            else { state.t5.selected.push(w); btn.classList.add('selected'); }
        };
        grid.appendChild(btn);
    });
}
function submitT5() {
    let hits = 0; state.t5.selected.forEach(w => { if(WORDS_TARGET.includes(w)) hits++; });
    state.t5.score = hits;
    showView('view-chat');
    sendSystemMsg(`再认结果: ${hits}/3`);
}

// Utils
function sendSystemMsg(text) {
    state.chatHistory.push({ role: "user", parts: [{ text: `[SYSTEM] ${text}` }] });
    addMsg('ai', '<div class="typing-indicator"><span></span><span></span><span></span></div>');
    callLLM(state.chatHistory).then(reply => { document.querySelector('.msg-row:last-child').remove(); processAI(reply); });
}
function addMsg(role, html) {
    const div = document.createElement('div'); div.className = `msg-row ${role}`;
    let avatar = role === 'ai' ? '<div class="avatar">👨‍⚕️</div>' : '';
    div.innerHTML = `${avatar}<div class="msg-bubble ${role}">${html}</div>`;
    document.getElementById('chat-box').appendChild(div);
    document.getElementById('chat-box').scrollTop = 9999;
    return 'msg-' + Date.now();
}
function startSystem() {
    if(!state.config.apiKey) return toggleSettings();
    showView('view-chat');
    const greeting = "您好，我是 Dr. CAS。今天感觉如何？";
    addMsg('ai', greeting);
    state.chatHistory.push({role:"model", parts:[{text:greeting}]});
}
function showView(id) { document.querySelectorAll('.view-section').forEach(e=>e.classList.remove('active')); document.getElementById(id).classList.add('active'); }
function generateReport() {
    showView('view-report');
    document.getElementById('report-content').innerText = "正在生成报告...";
    callLLM([...state.chatHistory, {role:"user", parts:[{text:"请生成最终临床报告"}]}]).then(res => {
        document.getElementById('report-content').innerHTML = marked.parse(res);
    });
}
function toggleSettings() {
    const m = document.getElementById('settings-modal');
    m.style.display = m.style.display === 'flex' ? 'none' : 'flex';
}
function updateProviderFields() {
    const p = document.getElementById('ai-provider').value;
    document.getElementById('group-model').style.display = (p === 'custom') ? 'block' : 'none';
}
function saveSettings() {
    state.config.provider = document.getElementById('ai-provider').value;
    state.config.apiKey = document.getElementById('api-key').value;
    state.config.modelName = document.getElementById('model-name').value;
    localStorage.setItem('cas_config_v85', JSON.stringify(state.config));
    updateBadge();
    toggleSettings();
}
function updateBadge() { document.getElementById('model-badge').innerText = state.config.provider.toUpperCase(); }
function exportData() { alert("Data exported!"); }
</script>
</body>
</html>
