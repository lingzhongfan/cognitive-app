<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robotic TMS Neuronavigation Real-time Interface</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --text-main: #e0e0e0;
            --accent: #00d2ff;
            --danger: #ff4c4c;
            --success: #00e676;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--panel-bg);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
        }
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: var(--success);
            box-shadow: 0 0 8px var(--success);
        }
        .main-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 20px;
            flex: 1;
        }
        .panel {
            background-color: var(--panel-bg);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
        }
        h2 {
            margin-top: 0;
            font-size: 1.2rem;
            color: var(--accent);
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }
        /* 可视化区域 */
        .canvas-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            border: 1px solid #333;
            border-radius: 4px;
            position: relative;
            overflow: hidden;
        }
        canvas {
            width: 100%;
            height: 100%;
        }
        /* 控制面板表单 */
        .control-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }
        .input-item {
            display: flex;
            flex-direction: column;
        }
        label {
            font-size: 0.85rem;
            margin-bottom: 5px;
            color: #aaa;
        }
        input {
            background: #2a2a2a;
            border: 1px solid #444;
            color: white;
            padding: 8px;
            border-radius: 4px;
            font-family: monospace;
        }
        input:focus {
            outline: none;
            border-color: var(--accent);
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: auto;
        }
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }
        .btn-primary { background-color: var(--accent); color: #000; }
        .btn-primary:hover { background-color: #00b8e6; }
        .btn-danger { background-color: var(--danger); color: #fff; }
        .btn-danger:hover { background-color: #e60000; }
        
        /* 状态与计算数据 */
        .data-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .data-card {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 4px;
            text-align: center;
        }
        .data-value {
            font-size: 1.5rem;
            font-family: monospace;
            color: var(--accent);
            margin-top: 5px;
        }
        .error-value {
            color: var(--danger);
        }
        .error-safe {
            color: var(--success);
        }
    </style>
</head>
<body>

    <header>
        <h1>Robotic TMS 神经导航监控系统</h1>
        <div class="status-indicator">
            <div class="status-dot" id="system-status-dot"></div>
            <span id="system-status-text">系统就绪 (实时监听)</span>
        </div>
    </header>

    <div class="main-container">
        <div class="panel">
            <h2>实时空间导航 (Axial View)</h2>
            <div class="canvas-container">
                <canvas id="navCanvas"></canvas>
            </div>
        </div>

        <div class="panel">
            <h2>运动控制与参数设置</h2>
            <div class="control-group">
                <div class="input-item">
                    <label>Target X (MNI mm)</label>
                    <input type="number" id="targetX" value="35.0" step="0.1">
                </div>
                <div class="input-item">
                    <label>Target Y (MNI mm)</label>
                    <input type="number" id="targetY" value="-20.0" step="0.1">
                </div>
                <div class="input-item">
                    <label>Target Z (MNI mm)</label>
                    <input type="number" id="targetZ" value="50.0" step="0.1">
                </div>
                <div class="input-item">
                    <label>刺激强度 (% MSO)</label>
                    <input type="number" id="intensity" value="110" step="1">
                </div>
            </div>
            <div class="btn-group">
                <button class="btn-primary" onclick="startRobotMovement()">驱动机械臂至靶点</button>
                <button class="btn-primary" onclick="triggerStimulation()" id="stimBtn" disabled style="background-color: #555; color: #888;">触发单脉冲刺激</button>
                <button class="btn-danger" onclick="emergencyStop()">急停 (E-STOP)</button>
            </div>
        </div>

        <div class="panel">
            <h2>实时运动学数据</h2>
            <div class="data-grid">
                <div class="data-card">
                    <label>当前线圈 X</label>
                    <div class="data-value" id="currentX">0.00</div>
                </div>
                <div class="data-card">
                    <label>当前线圈 Y</label>
                    <div class="data-value" id="currentY">0.00</div>
                </div>
                <div class="data-card">
                    <label>当前线圈 Z</label>
                    <div class="data-value" id="currentZ">0.00</div>
                </div>
                <div class="data-card">
                    <label>靶向欧氏误差 (Euclidean Error)</label>
                    <div class="data-value error-value" id="targetError">--- mm</div>
                </div>
            </div>
            <p style="color: #aaa; font-size: 0.85rem; margin-top: 20px;">
                * 空间误差计算: $d = \sqrt{(x_t-x_c)^2 + (y_t-y_c)^2 + (z_t-z_c)^2}$
            </p>
        </div>

        <div class="panel">
            <h2>运动诱发电位 (MEP) 实时反馈</h2>
            <div class="canvas-container" style="background: var(--panel-bg); border: none;">
                <canvas id="mepChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        // --- 全局变量与状态 ---
        let robotCurrentPos = { x: 0, y: 0, z: 0 };
        let robotTargetPos = { x: 35, y: -20, z: 50 };
        let isMoving = false;
        let animationFrameId;
        
        // --- 1. 空间导航可视化 (Canvas) ---
        const canvas = document.getElementById('navCanvas');
        const ctx = canvas.getContext('2d');
        
        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function drawNavigation() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const scale = 2; // 缩放因子(mm到像素)

            // 画一个示意性的脑部轮廓 (Axial view)
            ctx.beginPath();
            ctx.ellipse(centerX, centerY, 80 * scale, 100 * scale, 0, 0, 2 * Math.PI);
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            ctx.stroke();

            // 绘制靶点 (十字准星)
            const tgtCanvasX = centerX + robotTargetPos.x * scale;
            const tgtCanvasY = centerY - robotTargetPos.y * scale; // Y轴翻转
            
            ctx.beginPath();
            ctx.moveTo(tgtCanvasX - 10, tgtCanvasY);
            ctx.lineTo(tgtCanvasX + 10, tgtCanvasY);
            ctx.moveTo(tgtCanvasX, tgtCanvasY - 10);
            ctx.lineTo(tgtCanvasX, tgtCanvasY + 10);
            ctx.strokeStyle = '#00e676';
            ctx.lineWidth = 2;
            ctx.stroke();

            // 绘制当前 TMS 线圈位置 (8字形线圈示意)
            const curCanvasX = centerX + robotCurrentPos.x * scale;
            const curCanvasY = centerY - robotCurrentPos.y * scale;

            ctx.beginPath();
            ctx.arc(curCanvasX - 15, curCanvasY, 15, 0, Math.PI * 2);
            ctx.arc(curCanvasX + 15, curCanvasY, 15, 0, Math.PI * 2);
            ctx.strokeStyle = '#00d2ff';
            ctx.lineWidth = 3;
            ctx.stroke();
            
            // 连线：当前位置到靶点
            ctx.beginPath();
            ctx.moveTo(curCanvasX, curCanvasY);
            ctx.lineTo(tgtCanvasX, tgtCanvasY);
            ctx.strokeStyle = 'rgba(255, 76, 76, 0.5)';
            ctx.setLineDash([5, 5]);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        // --- 2. 运动控制与误差计算 ---
        function calculateError() {
            const dx = robotTargetPos.x - robotCurrentPos.x;
            const dy = robotTargetPos.y - robotCurrentPos.y;
            const dz = robotTargetPos.z - robotCurrentPos.z;
            return Math.sqrt(dx*dx + dy*dy + dz*dz);
        }

        function updateDataDisplay() {
            document.getElementById('currentX').innerText = robotCurrentPos.x.toFixed(2);
            document.getElementById('currentY').innerText = robotCurrentPos.y.toFixed(2);
            document.getElementById('currentZ').innerText = robotCurrentPos.z.toFixed(2);
            
            const error = calculateError();
            const errorElement = document.getElementById('targetError');
            errorElement.innerText = error.toFixed(2) + ' mm';
            
            // 误差小于 2mm 判定为到达靶点
            const stimBtn = document.getElementById('stimBtn');
            if (error < 2.0) {
                errorElement.className = 'data-value error-safe';
                stimBtn.disabled = false;
                stimBtn.style.backgroundColor = 'var(--accent)';
                stimBtn.style.color = '#000';
            } else {
                errorElement.className = 'data-value error-value';
                stimBtn.disabled = true;
                stimBtn.style.backgroundColor = '#555';
                stimBtn.style.color = '#888';
            }
        }

        function simulateRobotMovement() {
            if (!isMoving) return;
            
            // 简单的比例控制算法模拟机械臂接近靶点
            const speed = 0.05; 
            robotCurrentPos.x += (robotTargetPos.x - robotCurrentPos.x) * speed;
            robotCurrentPos.y += (robotTargetPos.y - robotCurrentPos.y) * speed;
            robotCurrentPos.z += (robotTargetPos.z - robotCurrentPos.z) * speed;
            
            // 添加一些高斯噪声模拟真实传感器的抖动
            robotCurrentPos.x += (Math.random() - 0.5) * 0.2;
            robotCurrentPos.y += (Math.random() - 0.5) * 0.2;
            robotCurrentPos.z += (Math.random() - 0.5) * 0.2;

            updateDataDisplay();
            drawNavigation();
            
            const error = calculateError();
            if (error < 0.5) {
                isMoving = false; // 停止模拟运动
                setSystemStatus('已到达靶点', 'var(--success)');
            } else {
                animationFrameId = requestAnimationFrame(simulateRobotMovement);
            }
        }

        function startRobotMovement() {
            // 获取输入值
            robotTargetPos.x = parseFloat(document.getElementById('targetX').value);
            robotTargetPos.y = parseFloat(document.getElementById('targetY').value);
            robotTargetPos.z = parseFloat(document.getElementById('targetZ').value);
            
            isMoving = true;
            setSystemStatus('机械臂移动中...', '#ffaa00');
            cancelAnimationFrame(animationFrameId);
            simulateRobotMovement();
        }

        function emergencyStop() {
            isMoving = false;
            cancelAnimationFrame(animationFrameId);
            setSystemStatus('急停已触发！', 'var(--danger)');
        }

        function setSystemStatus(text, color) {
            document.getElementById('system-status-text').innerText = text;
            document.getElementById('system-status-dot').style.backgroundColor = color;
            document.getElementById('system-status-dot').style.boxShadow = `0 0 8px ${color}`;
        }

        // --- 3. 生理反馈 (MEP) 可视化 (Chart.js) ---
        const ctxChart = document.getElementById('mepChart').getContext('2d');
        const mepDataLength = 100; // 时间轴点数
        const emptyData = Array.from({length: mepDataLength}, () => 0);
        
        const mepChart = new Chart(ctxChart, {
            type: 'line',
            data: {
                labels: Array.from({length: mepDataLength}, (_, i) => i),
                datasets: [{
                    label: 'EMG Signal (μV)',
                    data: [...emptyData],
                    borderColor: 'var(--accent)',
                    borderWidth: 2,
                    pointRadius: 0,
                    tension: 0.4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: { duration: 0 },
                scales: {
                    x: { display: false },
                    y: { 
                        display: true, 
                        min: -100, 
                        max: 100,
                        grid: { color: '#333' }
                    }
                },
                plugins: { legend: { display: false } }
            }
        });

        function triggerStimulation() {
            setSystemStatus('刺激输出中', 'var(--accent)');
            
            // 模拟 MEP 信号波形发生 (具有潜伏期的双相波)
            const newData = [...emptyData];
            const latency = 20; // 潜伏期
            const amplitude = document.getElementById('intensity').value * 0.8; // 振幅受刺激强度影响
            
            for (let i = 0; i < mepDataLength; i++) {
                if (i === latency) {
                    newData[i] = amplitude;
                } else if (i === latency + 5) {
                    newData[i] = -amplitude * 0.6;
                } else if (i > latency && i < latency + 15) {
                    // 模拟波形平滑衰减
                    newData[i] = newData[i-1] * -0.5; 
                }
                // 添加基线噪声
                newData[i] += (Math.random() - 0.5) * 5;
            }

            mepChart.data.datasets[0].data = newData;
            mepChart.update();

            // 刺激完成后恢复状态
            setTimeout(() => {
                setSystemStatus('系统就绪 (已对齐靶点)', 'var(--success)');
            }, 500);
        }

        // 初始化显示
        drawNavigation();
        updateDataDisplay();

    </script>
</body>
</html>
