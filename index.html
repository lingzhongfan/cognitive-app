<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CAS v7.0 (AI Doctor)</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* ==================== 核心样式 ==================== */
        :root { --primary: #2A5C82; --bg: #F0F2F5; --chat-bg: #FFFFFF; --user-msg: #95EC69; --ai-msg: #FFFFFF; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* 聊天界面 */
        .chat-container { flex: 1; display: flex; flex-direction: column; max-width: 800px; margin: 0 auto; width: 100%; position: relative; }
        .chat-header { padding: 15px; background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); border-bottom: 1px solid #ddd; display: flex; align-items: center; justify-content: space-between; z-index: 10; }
        .avatar { width: 45px; height: 45px; border-radius: 50%; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; margin-right: 10px; }
        
        .chat-history { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; scroll-behavior: smooth; }
        .msg-row { display: flex; width: 100%; }
        .msg-row.user { justify-content: flex-end; }
        .msg-bubble { padding: 12px 16px; border-radius: 12px; max-width: 80%; font-size: 1rem; line-height: 1.5; position: relative; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .msg-bubble.ai { background: var(--ai-msg); border-top-left-radius: 2px; }
        .msg-bubble.user { background: var(--user-msg); border-top-right-radius: 2px; }
        .msg-bubble.system { background: #FFF3CD; color: #856404; font-size: 0.85rem; align-self: center; border-radius: 20px; padding: 5px 15px; }

        .input-area { padding: 15px; background: #fff; border-top: 1px solid #eee; display: flex; gap: 10px; align-items: center; }
        input { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 24px; font-size: 1rem; outline: none; transition: border 0.3s; }
        input:focus { border-color: var(--primary); }
        .btn-icon { width: 45px; height: 45px; border-radius: 50%; border: none; background: var(--primary); color: white; cursor: pointer; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; transition: transform 0.1s; }
        .btn-icon:active { transform: scale(0.9); }
        .btn-icon.secondary { background: #f0f0f0; color: #666; }

        /* 游戏嵌入层 (Overlay) */
        .game-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 100; display: none; flex-direction: column; animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .game-header { padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; }
        .game-content { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; justify-content: center; }

        /* 复用 v6.2 的关键样式 (SDMT/Corsi) */
        .sdmt-legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; padding: 10px; background: #F0F4F8; border-radius: 12px; margin-bottom: 15px; }
        .sdmt-legend-item { width: 50px; background: white; border-radius: 6px; text-align: center; border: 1px solid #ddd; }
        .sdmt-legend-sym { font-size: 1.8rem; color: var(--primary); padding: 5px; }
        .sdmt-legend-num { background: #eee; font-weight: bold; padding: 2px; }
        .sdmt-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 360px; margin: 0 auto; }
        .key-btn { padding: 20px; background: white; border: 1px solid #ddd; border-radius: 8px; font-size: 1.5rem; font-weight: bold; cursor: pointer; box-shadow: 0 2px 0 #ccc; }
        .key-btn:active { transform: translateY(2px); box-shadow: none; }
        #t6-target { font-size: 4rem; text-align: center; margin: 10px 0; color: var(--primary); filter: drop-shadow(0 4px 0 rgba(0,0,0,0.1)); }
        
        .corsi-board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 300px; margin: 0 auto; }
        .corsi-block { padding-bottom: 100%; background: #e0e0e0; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .corsi-block.lit { background: #FF7043; transform: scale(1.05); }
        .corsi-block.active { background: #FF7043; } /* User tap feedback */
        
        /* 报告样式 */
        .report-box { background: white; padding: 20px; border-radius: 12px; border: 1px solid #eee; margin-top: 10px; font-size: 0.9rem; }
        .loading-dots:after { content: '.'; animation: dots 1.5s steps(5, end) infinite; }
        @keyframes dots { 0%, 20% { content: '.'; } 40% { content: '..'; } 60% { content: '...'; } 80%, 100% { content: ''; } }
        
        /* Setting Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 200; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 20px; border-radius: 12px; width: 90%; max-width: 400px; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <div style="display:flex; align-items:center;">
            <div class="avatar">👨‍⚕️</div>
            <div>
                <div style="font-weight:bold;">Dr. CAS (AI 医生)</div>
                <div style="font-size:0.75rem; color:#888;">在线 • 认知评估中</div>
            </div>
        </div>
        <button class="btn-icon secondary" onclick="toggleSettings()" style="width:36px; height:36px;">⚙️</button>
    </div>

    <div id="chat-history" class="chat-history">
        <div class="msg-row"><div class="msg-bubble system">⚠️ 请先在设置中输入 API Key 才能开始对话</div></div>
    </div>

    <div class="input-area">
        <button class="btn-icon secondary" onclick="alert('语音功能开发中...')">🎤</button>
        <input type="text" id="user-input" placeholder="输入消息..." onkeydown="if(event.key==='Enter') sendMessage()">
        <button class="btn-icon" onclick="sendMessage()">➤</button>
    </div>
</div>

<div id="game-overlay" class="game-overlay">
    <div class="game-header">
        <span id="game-title" style="font-weight:bold; font-size:1.1rem;">测试任务</span>
        <button onclick="closeGame(false)" style="border:none; background:none; color:#666;">放弃</button>
    </div>
    <div id="game-content-area" class="game-content">
        </div>
</div>

<div id="settings-modal" class="modal">
    <div class="modal-content">
        <h3>🔧 系统设置</h3>
        <p style="font-size:0.85rem; color:#666;">要启用 AI 医生，请提供 Google Gemini API Key。</p>
        <input type="password" id="api-key-input" placeholder="AIzaSy..." style="width:100%; box-sizing:border-box; margin: 10px 0;">
        <div style="text-align:right; margin-top:10px;">
            <button onclick="saveSettings()" style="padding:8px 20px; background:var(--primary); color:white; border:none; border-radius:6px;">保存并连接</button>
        </div>
    </div>
</div>

<script>
/**
 * CAS v7.0: Conversational AI Core
 * 混合了 LLM 对话管理与 v6.2 的测量引擎
 */

// --- 1. 状态管理 ---
let state = {
    apiKey: localStorage.getItem('cas_ai_key') || "",
    chatHistory: [],
    currentGame: null,
    // 存储测量数据
    scores: {
        t6_sdmt: { score: 0, latencies: [] },
        t2_corsi: { span: 0 }
    }
};

// 游戏素材 (Symbols for SDMT)
const SYMBOLS = ['⊏', '⊐', '⊓', '⊔', '○', '□', '◇', '☆', '△'];
let t6Map = [];

// 系统 Prompt (核心大脑)
const SYSTEM_PROMPT = `
你是一位专业的神经内科医生 "Dr. CAS"。你的任务是通过自然对话，隐式地评估用户的认知功能。
请严格按以下步骤推进对话（不要一次性问完）：

1. **[破冰与定向]**：寒暄，询问用户今天感觉如何，并自然地询问当前的时间（日期）和地点。
2. **[记忆植入]**：告诉用户："我最近打算去买三样东西：[老虎、钢琴、玫瑰]。请您重复一遍，帮我记一下。" (必须确认用户重复了这三样东西)。
3. **[干扰]**：聊两句无关的话题（如天气、爱好），持续 1-2 轮对话。
4. **[任务唤起-空间]**：说："对了，为了活跃一下大脑，我们来玩个简单的点方块游戏吧？" -> **输出指令 [START_CORSI]**
5. **[任务唤起-速度]**：游戏回来后，夸奖用户，然后说："还有一个看图找数字的游戏，比比看谁手快？" -> **输出指令 [START_SDMT]**
6. **[延迟回忆]**：所有游戏结束后，突击询问："对了，咱们刚开始聊天时，我提到要买的那三样东西，您还记得是什么吗？"
7. **[总结]**：根据用户回答，给出鼓励性的结束语，并**输出指令 [GENERATE_REPORT]**。

**重要规则**：
- 每次只执行一个步骤。
- 语气要亲切、像朋友聊天，不要像考试。
- 如果需要唤起游戏，请单独一行输出指令（如 [START_SDMT]），不要加其他标点。
`;

// --- 2. 初始化 ---
window.onload = () => {
    if(!state.apiKey) {
        toggleSettings();
    } else {
        initChat();
    }
};

function toggleSettings() {
    const m = document.getElementById('settings-modal');
    m.style.display = m.style.display === 'flex' ? 'none' : 'flex';
    document.getElementById('api-key-input').value = state.apiKey;
}

function saveSettings() {
    const key = document.getElementById('api-key-input').value.trim();
    if(key) {
        state.apiKey = key;
        localStorage.setItem('cas_ai_key', key);
        toggleSettings();
        if(state.chatHistory.length === 0) initChat();
        else addMsg("System", "API Key 更新成功", "system");
    }
}

function initChat() {
    // 开场白
    state.chatHistory = [{ role: "user", parts: [{ text: "你好，医生。" }] }]; // 隐式触发
    addMsg("Dr. CAS", "您好！我是您的专属健康顾问。很高兴见到您，今天感觉精神怎么样？", "ai");
    state.chatHistory.push({ role: "model", parts: [{ text: "您好！我是您的专属健康顾问。很高兴见到您，今天感觉精神怎么样？" }] });
}

// --- 3. 消息处理与 LLM 调用 ---
async function sendMessage() {
    const input = document.getElementById('user-input');
    const text = input.value.trim();
    if(!text) return;
    
    addMsg("我", text, "user");
    input.value = "";
    
    state.chatHistory.push({ role: "user", parts: [{ text: text }] });
    
    // 显示思考中
    const loadingId = addMsg("Dr. CAS", "<span class='loading-dots'>思考中</span>", "ai");
    
    try {
        const responseText = await callGemini(state.chatHistory);
        document.getElementById(loadingId).remove(); // 移除 loading 气泡
        
        // --- 核心：指令解析 ---
        if (responseText.includes("[START_SDMT]")) {
            addMsg("Dr. CAS", "好的，我们来试一下这个眼疾手快的小挑战！", "ai");
            setTimeout(() => launchGame('SDMT'), 1000);
            state.chatHistory.push({ role: "model", parts: [{ text: "好的，请开始测试。" }] }); // 修正历史，避免存入指令
        } 
        else if (responseText.includes("[START_CORSI]")) {
            addMsg("Dr. CAS", "来试试这个记方块的游戏吧。", "ai");
            setTimeout(() => launchGame('Corsi'), 1000);
            state.chatHistory.push({ role: "model", parts: [{ text: "好的，请开始测试。" }] });
        }
        else if (responseText.includes("[GENERATE_REPORT]")) {
            addMsg("Dr. CAS", responseText.replace("[GENERATE_REPORT]", ""), "ai");
            generateReport();
        }
        else {
            addMsg("Dr. CAS", responseText, "ai");
            state.chatHistory.push({ role: "model", parts: [{ text: responseText }] });
        }
        
    } catch (e) {
        document.getElementById(loadingId).innerText = "连接断开 (请检查 Key)";
    }
}

async function callGemini(history) {
    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${state.apiKey}`;
    
    // 构造请求，将 System Prompt 放在最前
    const payload = {
        systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] },
        contents: history
    };

    const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
    });
    const data = await res.json();
    return data.candidates[0].content.parts[0].text;
}

function addMsg(name, text, type) {
    const div = document.getElementById('chat-history');
    const id = 'msg-' + Date.now();
    const html = `
        <div class="msg-row ${type}">
            ${type==='ai' ? '<div class="avatar">👨‍⚕️</div>' : ''}
            <div class="msg-bubble ${type}" id="${id}">${text}</div>
        </div>`;
    div.insertAdjacentHTML('beforeend', html);
    div.scrollTop = div.scrollHeight;
    return id;
}

// --- 4. 游戏引擎 (Mini-Games Engine) ---

function launchGame(type) {
    const overlay = document.getElementById('game-overlay');
    const area = document.getElementById('game-content-area');
    const title = document.getElementById('game-title');
    
    overlay.style.display = 'flex';
    state.currentGame = type;
    area.innerHTML = ''; // Clear
    
    if (type === 'SDMT') setupSDMT(area);
    if (type === 'Corsi') setupCorsi(area);
    
    title.innerText = type === 'SDMT' ? "快速匹配 (60秒)" : "空间记忆";
}

function closeGame(finished) {
    document.getElementById('game-overlay').style.display = 'none';
    
    if (finished) {
        // 向 AI 发送隐形反馈
        let feedback = "";
        if (state.currentGame === 'SDMT') {
            feedback = `[SYSTEM] 用户完成了 SDMT 测试。得分：${state.scores.t6_sdmt.score}。请夸奖用户并继续。`;
        } else {
            feedback = `[SYSTEM] 用户完成了 Corsi 测试。广度等级：${state.scores.t2_corsi.span}。请继续。`;
        }
        
        state.chatHistory.push({ role: "user", parts: [{ text: feedback }] });
        // 自动触发 AI 回复
        addMsg("系统", "测试数据已上传...", "system");
        setTimeout(async () => {
             const reply = await callGemini(state.chatHistory);
             addMsg("Dr. CAS", reply, "ai");
             state.chatHistory.push({ role: "model", parts: [{ text: reply }] });
        }, 800);
    }
}

// --- 4.1 SDMT 实现 (v6.2 Simplified) ---
let sdmtTimer = null;
function setupSDMT(container) {
    // 1. Generate Key
    state.scores.t6_sdmt.score = 0;
    t6Map = SYMBOLS.sort(() => 0.5 - Math.random()).map((s, i) => ({ s, n: i + 1 }));
    
    let html = `<div class="sdmt-legend">`;
    t6Map.forEach(k => {
        html += `<div class="sdmt-legend-item"><div class="sdmt-legend-sym">${k.s}</div><div class="sdmt-legend-num">${k.n}</div></div>`;
    });
    html += `</div>
             <div id="t6-target">?</div>
             <div class="sdmt-grid">`;
    for(let i=1; i<=9; i++) html += `<button class="key-btn" onclick="handleSDMTInput(${i})">${i}</button>`;
    html += `</div><div style="text-align:center; margin-top:20px; color:red; font-weight:bold;" id="sdmt-time">60s</div>`;
    
    container.innerHTML = html;
    nextSDMTTarget();
    
    let time = 60;
    sdmtTimer = setInterval(() => {
        time--;
        const el = document.getElementById('sdmt-time');
        if(el) el.innerText = time + 's';
        if(time <= 0) {
            clearInterval(sdmtTimer);
            alert("时间到！");
            closeGame(true);
        }
    }, 1000);
}

let currentSDMTTarget = null;
window.handleSDMTInput = (n) => {
    if (n === currentSDMTTarget.n) state.scores.t6_sdmt.score++;
    nextSDMTTarget();
};

function nextSDMTTarget() {
    currentSDMTTarget = t6Map[Math.floor(Math.random() * 9)];
    const el = document.getElementById('t6-target');
    if(el) el.innerText = currentSDMTTarget.s;
}

// --- 4.2 Corsi 实现 (v6.2 Simplified) ---
function setupCorsi(container) {
    let html = `<div class="corsi-board">`;
    for(let i=0; i<9; i++) html += `<div class="corsi-block" id="b${i}" onclick="handleCorsiInput(${i})"></div>`;
    html += `</div><div style="text-align:center; margin-top:20px;"><button class="btn-icon" onclick="startCorsiRound()" style="width:auto; padding:0 20px; border-radius:8px;">开始</button></div>`;
    container.innerHTML = html;
    state.scores.t2_corsi.span = 2; // Start level
}

let corsiSeq = [], userSeq = [];
window.startCorsiRound = () => {
    corsiSeq = []; userSeq = [];
    // 生成简单序列 (仅演示用)
    for(let i=0; i<state.scores.t2_corsi.span; i++) corsiSeq.push(Math.floor(Math.random()*9));
    
    let i = 0;
    let int = setInterval(() => {
        if(i >= corsiSeq.length) { clearInterval(int); return; }
        const b = document.getElementById('b'+corsiSeq[i]);
        b.classList.add('lit');
        setTimeout(() => b.classList.remove('lit'), 600);
        i++;
    }, 1000);
};

window.handleCorsiInput = (i) => {
    const b = document.getElementById('b'+i);
    b.classList.add('active'); setTimeout(() => b.classList.remove('active'), 200);
    userSeq.push(i);
    if(userSeq.length === corsiSeq.length) {
        // Simple check
        if(JSON.stringify(userSeq) === JSON.stringify(corsiSeq)) {
            state.scores.t2_corsi.span++;
            setTimeout(() => { alert("正确！下一关"); startCorsiRound(); }, 500);
        } else {
            alert("游戏结束");
            closeGame(true);
        }
    }
};

// --- 5. 报告生成 ---
async function generateReport() {
    const historyText = state.chatHistory.map(m => `${m.role}: ${m.parts[0].text}`).join("\n");
    const prompt = `
    Based on the following conversation and game scores, generate a structured clinical summary in JSON format.
    Game Scores: SDMT=${state.scores.t6_sdmt.score}, Corsi=${state.scores.t2_corsi.span}.
    Conversation Log:
    ${historyText}
    
    Analyze:
    1. Orientation (Did they know time/place?)
    2. Immediate Recall (Did they repeat the 3 words?)
    3. Delayed Recall (Did they remember them at the end?)
    
    Output Format:
    {
       "clinical_impression": "...",
       "scores": { "orientation": "ok/impaired", "memory": "ok/impaired", "speed_score": number }
    }
    `;
    // 这里仅做演示，实际会将此 JSON 渲染为图表
    const reportHtml = `
        <div class="report-box">
            <h3>📊 初步评估报告</h3>
            <p><strong>加工速度 (SDMT):</strong> ${state.scores.t6_sdmt.score} 分</p>
            <p><strong>空间广度 (Corsi):</strong> ${state.scores.t2_corsi.span} 级</p>
            <p><strong>定向力与记忆:</strong> (AI 正在分析对话内容...)</p>
            <div style="margin-top:10px; padding:10px; background:#f9f9f9; border-left:4px solid var(--primary);">
                <em>医生建议：请结合临床影像学检查进一步确诊。</em>
            </div>
        </div>
    `;
    addMsg("系统", reportHtml, "system");
}

</script>
</body>
</html>
